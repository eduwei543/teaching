<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Draw</title>
<style>
:root{font-family:ui-rounded,"PingFang TC","Noto Sans TC",sans-serif;color:#183c53;background:#e4f8f5}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 18%,#fff2bd 0 5%,transparent 5.2%),radial-gradient(circle at 89% 80%,#ffd7c5 0 7%,transparent 7.2%),#e4f8f5}.app{width:min(100%,680px);text-align:center}.tag{display:inline-block;color:#177c81;background:#fff;padding:8px 18px;border-radius:99px;font-weight:800;letter-spacing:.14em;box-shadow:0 4px 0 #b7dedb}h1{font-size:clamp(2.5rem,7vw,4.5rem);line-height:1.1;margin:24px 0 8px;letter-spacing:.05em}p{font-size:1.1rem;color:#567383;margin:0 0 25px}.stage{background:#fffdf8;border:3px solid #183c53;border-radius:34px;padding:30px 24px 28px;box-shadow:8px 9px 0 #183c53;position:relative;overflow:hidden}.stage:before,.stage:after{position:absolute;font-size:2rem;color:#f4b73f}.stage:before{content:'✦';left:9%;top:11%}.stage:after{content:'✦';right:9%;bottom:17%;color:#ef8e7d}.label{font-weight:800;letter-spacing:.13em;color:#368b90;font-size:.95rem}.card{width:clamp(160px,34vw,220px);height:clamp(190px,40vw,260px);display:grid;place-items:center;margin:18px auto 24px;background:#ffe68d;border:3px solid #183c53;border-radius:24px;box-shadow:6px 6px 0 #f3b757;font-size:clamp(6rem,19vw,10rem);font-weight:900;line-height:1;color:#183c53;transform:rotate(-3deg)}.card.spinning{animation:wiggle .18s infinite alternate}@keyframes wiggle{to{transform:rotate(3deg) scale(1.03)}}button{border:3px solid #183c53;background:#ff927c;color:#183c53;font:800 1.35rem inherit;font-family:inherit;font-size:1.35rem;font-weight:800;border-radius:16px;padding:14px 40px;box-shadow:0 5px 0 #183c53;cursor:pointer;transition:transform .15s,box-shadow .15s}button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #183c53}button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #183c53}button:disabled{opacity:.7;cursor:wait}button:focus-visible{outline:4px solid #168a91;outline-offset:5px}.hint{margin:22px 0 0;font-size:.95rem;font-weight:700}@media(max-width:480px){body{padding:20px 18px}.stage{padding:24px 14px}.hint{font-size:.9rem}}@media(prefers-reduced-motion:reduce){.card.spinning{animation:none}}
</style>
</head>
<body><main class="app"><span class="tag">NUMBER DRAW ✦</span><h1>Draw a Number</h1><p>Pick a number from 1 to 7.</p><section class="stage" aria-label="Draw result"><div class="label">YOUR NUMBER</div><div id="card" class="card" aria-live="polite" aria-atomic="true">?</div><button id="draw" type="button">Draw a Number</button><p class="hint">Numbers 1–7</p></section></main>
<script>
const card=document.querySelector('#card');const button=document.querySelector('#draw');
function randomCard(){return Math.floor(Math.random()*7)+1}
button.addEventListener('click',()=>{button.disabled=true;button.textContent='Drawing…';card.classList.add('spinning');card.setAttribute('aria-live','off');const timer=setInterval(()=>card.textContent=randomCard(),100);setTimeout(()=>{clearInterval(timer);card.textContent=randomCard();card.classList.remove('spinning');card.setAttribute('aria-live','polite');button.disabled=false;button.textContent='Draw Again'},2000)});
</script></body></html>
